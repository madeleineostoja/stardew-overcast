name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Check out Overcast
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path("Overcast.csproj").read_text()
          version = re.search(r"<Version>([^<]+)</Version>", project).group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"project version is not a valid release version: {version!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Detect whether the current version needs a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          tag = quote(f'v{os.environ["VERSION"]}', safe="")
          url = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f'Bearer {os.environ["GH_TOKEN"]}',
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urlopen(request) as response:
                  should_release = json.load(response)["draft"]
          except HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"could not check for an existing release: HTTP {error.code}")
              should_release = True

          if should_release:
              tag_commit = subprocess.run(
                  ["git", "rev-list", "-n", "1", f'v{os.environ["VERSION"]}'],
                  capture_output=True,
                  text=True,
                  check=False,
              ).stdout.strip()
              if tag_commit and tag_commit != os.environ["GITHUB_SHA"]:
                  raise SystemExit(
                      f'release tag points at {tag_commit}, not the current commit {os.environ["GITHUB_SHA"]}'
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"should_release={str(should_release).lower()}\n")
          PY

  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out Overcast
        uses: actions/checkout@v4

      - name: Check out Stardew reference assemblies
        uses: actions/checkout@v4
        with:
          repository: StardewModders/mod-reference-assemblies
          ref: 5cf4916f20e137bbb09311ebdaa935cc70e6a2bc
          path: mod-reference-assemblies

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore Overcast.csproj -p:GamePath="$GITHUB_WORKSPACE/mod-reference-assemblies"

      - name: Build release ZIP
        run: dotnet build Overcast.csproj --configuration Release --no-restore -p:GamePath="$GITHUB_WORKSPACE/mod-reference-assemblies" -p:EnableModDeploy=false

      - name: Run policy tests
        run: dotnet test Overcast.Tests/Overcast.Tests.csproj --configuration Release

      - name: Verify release version
        if: needs.prepare-release.outputs.should_release == 'true'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path("Overcast.csproj").read_text()
          project_version = re.search(r"<Version>([^<]+)</Version>", project).group(1)
          manifest = Path("manifest.json").read_text()
          if '"Version": "%ProjectVersion%"' not in manifest:
              raise SystemExit("manifest version must use the project version token")
          if project_version != os.environ["VERSION"]:
              raise SystemExit("project version changed during the workflow")
          PY

      - name: Upload install-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Overcast-release
          path: bin/**/*.zip
          if-no-files-found: error

  release:
    if: needs.prepare-release.outputs.should_release == 'true'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: Overcast-release
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/**/*.zip
          generate_release_notes: true
